name: echonova_sample
description: >-
  EchoNova Flutter sample: Text to Speech and Speech to Text streaming on
  Android, iOS and the web, through your own backend proxy.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  echonova:
    path: ../../dart
  flutter:
    sdk: flutter
  # Text to Speech playback on Android and iOS: raw PCM16 fed as it arrives.
  flutter_pcm_sound: ^3.3.3
  # The stream-token call to the proxy (web only).
  http: ^1.6.0
  # Microphone capture as a PCM16 stream on Android, iOS and the web.
  record: ^7.1.2
  # Text to Speech playback on the web (Web Audio).
  web: ^1.1.0

dev_dependencies:
  fake_async: ^1.3.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
