name: Live API tests

# Nightly: every SDK's live suite against the real API, with keys from a
# dedicated test workspace. It costs credits (roughly 1,000 per night for all
# three SDKs), so it never runs on pull requests, and the full-access key must
# have a Credit Limit as a hard spending cap.
#
# Setup (once): create the "live-tests" environment (Settings -> Environments),
# limited to the main branch, with
#   secrets: ECHONOVA_API_KEY (full access, Credit Limit set)
#            ECHONOVA_TTS_ONLY_KEY, ECHONOVA_DISABLED_KEY (optional: 403 and 401 checks)
#   variables: ECHONOVA_AGENT_ID, ECHONOVA_WIDGET_PUBLIC_ID (optional)
# Without ECHONOVA_API_KEY only the free checks run (rejected keys and handshakes).

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
    inputs:
      sdk:
        description: Which SDK to test
        type: choice
        options: [all, python, js, dart]
        default: all

permissions:
  contents: read

concurrency:
  group: live-api-tests
  cancel-in-progress: false

env:
  ECHONOVA_LIVE: "1"

jobs:
  python:
    name: Python
    if: github.repository == 'echonova-ai-solutions/echonova-sdks' && (github.event_name == 'schedule' || inputs.sdk == 'all' || inputs.sdk == 'python')
    runs-on: ubuntu-latest
    environment: live-tests
    timeout-minutes: 30
    env:
      ECHONOVA_API_KEY: ${{ secrets.ECHONOVA_API_KEY }}
      ECHONOVA_TTS_ONLY_KEY: ${{ secrets.ECHONOVA_TTS_ONLY_KEY }}
      ECHONOVA_DISABLED_KEY: ${{ secrets.ECHONOVA_DISABLED_KEY }}
      ECHONOVA_AGENT_ID: ${{ vars.ECHONOVA_AGENT_ID }}
      ECHONOVA_WIDGET_PUBLIC_ID: ${{ vars.ECHONOVA_WIDGET_PUBLIC_ID }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest -m live

  js:
    name: JavaScript
    if: github.repository == 'echonova-ai-solutions/echonova-sdks' && (github.event_name == 'schedule' || inputs.sdk == 'all' || inputs.sdk == 'js')
    runs-on: ubuntu-latest
    environment: live-tests
    timeout-minutes: 30
    env:
      ECHONOVA_API_KEY: ${{ secrets.ECHONOVA_API_KEY }}
      ECHONOVA_TTS_ONLY_KEY: ${{ secrets.ECHONOVA_TTS_ONLY_KEY }}
      ECHONOVA_DISABLED_KEY: ${{ secrets.ECHONOVA_DISABLED_KEY }}
      ECHONOVA_AGENT_ID: ${{ vars.ECHONOVA_AGENT_ID }}
      ECHONOVA_WIDGET_PUBLIC_ID: ${{ vars.ECHONOVA_WIDGET_PUBLIC_ID }}
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run test:live

  dart:
    name: Dart
    if: github.repository == 'echonova-ai-solutions/echonova-sdks' && (github.event_name == 'schedule' || inputs.sdk == 'all' || inputs.sdk == 'dart')
    runs-on: ubuntu-latest
    environment: live-tests
    timeout-minutes: 30
    env:
      ECHONOVA_API_KEY: ${{ secrets.ECHONOVA_API_KEY }}
      ECHONOVA_TTS_ONLY_KEY: ${{ secrets.ECHONOVA_TTS_ONLY_KEY }}
      ECHONOVA_DISABLED_KEY: ${{ secrets.ECHONOVA_DISABLED_KEY }}
      ECHONOVA_AGENT_ID: ${{ vars.ECHONOVA_AGENT_ID }}
      ECHONOVA_WIDGET_PUBLIC_ID: ${{ vars.ECHONOVA_WIDGET_PUBLIC_ID }}
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - run: dart pub get
      - run: dart test -t live

  report:
    name: Report a failure
    needs: [python, js, dart]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly live API tests failed"
          body="The nightly live suite failed: $RUN_URL. A failure here usually means the API changed behaviour, or the test workspace is out of credits."
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
