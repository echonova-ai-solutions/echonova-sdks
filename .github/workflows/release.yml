name: Release

# Publishes one SDK when its release tag is pushed:
#   python-v<version>  ->  PyPI     (trusted publishing, with attestations)
#   js-v<version>      ->  npm      (trusted publishing, with provenance)
#   dart-v<version>    ->  pub.dev  (automated publishing)
# The tag's version must equal the package's version. Every job runs in the
# protected "release" environment and authenticates with OIDC: no registry
# token is stored anywhere. One-time setup: docs/RELEASING.md.

on:
  push:
    tags: ["python-v*", "js-v*", "dart-v*"]

permissions:
  contents: read

jobs:
  python:
    if: startsWith(github.ref_name, 'python-v')
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/echonova/_version.py)
          test "python-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != python-v$version"; exit 1; }
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - run: uv publish --trusted-publishing always

  js:
    if: startsWith(github.ref_name, 'js-v')
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: The tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          test "js-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != js-v$version"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint:package
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@11
      - name: Publish (pre-releases go to the "beta" dist-tag)
        run: |
          case "$(node -p "require('./package.json').version")" in *-*) tag=beta ;; *) tag=latest ;; esac
          npm publish --provenance --access public --tag "$tag"

  dart:
    if: startsWith(github.ref_name, 'dart-v')
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: The tag matches the package version
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          test "dart-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != dart-v$version"; exit 1; }
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart pub publish --force
