name: Publish SDKs

# Publishes one SDK when its release tag is pushed:
#   py-vX.Y.Z    ->  PyPI     echonova       (environment "pypi")
#   js-vX.Y.Z    ->  npm      @echonova/ai   (environment "npm")
#   dart-vX.Y.Z  ->  pub.dev  echonova_ai    (environment "pubdev")
# Every registry trusts this workflow file (publish.yml) through OIDC trusted
# publishing: no API token or secret is stored anywhere. Each pipeline first
# checks that the tag's version equals the package's version, and runs the tests.
# npm releases are staged: the version goes public only after a maintainer approves
# it on npmjs.com with 2FA (docs/RELEASING.md).
# How to release: README.md, "Releasing".

on:
  push:
    tags: ["py-v*", "js-v*", "dart-v*"]

permissions:
  contents: read

jobs:
  # A tag can be pushed on any commit, including one that never went through review. Only a commit
  # that is already on main (merged through a pull request with CI passing) is published.
  on-main:
    name: The tagged commit is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"; exit 1; }

  # Each registry gets two jobs, like the Dart pipeline below: one that checks, tests and builds
  # without an OIDC token, and a minimal one that publishes the built files with it. Code from the
  # dependencies, tests and build tools never runs in a job that can mint a publishing token.
  pypi-build:
    name: Build the Python package
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: on-main
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        # The version has one source, src/echonova/_version.py, which pyproject.toml reads.
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/echonova/_version.py)
          test "py-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: uv sync --locked
      - run: uv run pytest
      - name: Build the sdist and wheel
        run: uv build --out-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error
          retention-days: 1

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: pypi-build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (release/v1)
        with:
          packages-dir: dist

  npm-build:
    name: Build the npm package
    if: startsWith(github.ref, 'refs/tags/js-v')
    needs: on-main
    runs-on: ubuntu-latest
    outputs:
      dist-tag: ${{ steps.dist-tag.outputs.tag }}
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: The tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          test "js-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: The npm dist-tag (beta for a pre-release)
        id: dist-tag
        run: |
          case "$(node -p "require('./package.json').version")" in *-*) tag=beta ;; *) tag=latest ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint:package
      - name: Pack the package (the tarball that is published)
        run: |
          mkdir -p "$RUNNER_TEMP/npm-dist"
          npm pack --pack-destination "$RUNNER_TEMP/npm-dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-dist
          path: ${{ runner.temp }}/npm-dist/*.tgz
          if-no-files-found: error
          retention-days: 1

  npm:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/js-v')
    needs: npm-build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-dist
          path: npm-dist
      - name: Use an npm with trusted publishing (11.5.1 or later)
        run: npm install -g "npm@11.21.2"
      # The trusted publisher on npm may only stage (npm's recommended setting): a maintainer then
      # approves the staged version on npmjs.com with 2FA, so this workflow alone can't release.
      - name: Stage the release (OIDC; no NODE_AUTH_TOKEN)
        env:
          DIST_TAG: ${{ needs.npm-build.outputs.dist-tag }}
        # The ./ matters: npm reads "npm-dist/x.tgz" as a GitHub owner/repo shorthand, not a file.
        run: |
          set -- ./npm-dist/*.tgz
          test "$#" -eq 1 || { echo "expected one package tarball, found $#"; exit 1; }
          npm stage publish "$1" --access public --tag "$DIST_TAG"

  dart-check:
    name: Check the Dart package
    if: startsWith(github.ref, 'refs/tags/dart-v')
    needs: on-main
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: The tag matches the package version
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          test "dart-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          grep -q "^## $version\b" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $version"; exit 1; }
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  pubdev:
    name: Publish to pub.dev
    if: startsWith(github.ref, 'refs/tags/dart-v')
    needs: dart-check
    # A job that calls a reusable workflow can't have steps of its own: the checks are in dart-check.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    permissions:
      id-token: write
    with:
      working-directory: dart
      environment: pubdev
