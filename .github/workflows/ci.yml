name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # runs every job

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each job below runs only when the change touches what it tests (tools/ci_changes.py says
  # which files feed which job). Changes to the shared spec, the tools or this workflow run
  # everything, as do manual runs. The spec and secret checks always run.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.areas.outputs.python }}
      js: ${{ steps.areas.outputs.js }}
      dart: ${{ steps.areas.outputs.dart }}
      docs: ${{ steps.areas.outputs.docs }}
      flutter: ${{ steps.areas.outputs.flutter }}
      fastapi: ${{ steps.areas.outputs.fastapi }}
      express: ${{ steps.areas.outputs.express }}
      workflows: ${{ steps.areas.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: areas
        name: Decide which jobs this change needs
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci_changes.py >> "$GITHUB_OUTPUT"

  workflows:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint (checksum verified)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: Lint every workflow (shellcheck checks the run scripts)
        run: '"$RUNNER_TEMP/actionlint" -color'

  spec:
    name: Shared spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generated fixtures are up to date
        run: |
          python3 tools/build_error_catalog.py
          python3 tools/build_mapping.py
          python3 tools/build_webhook_vectors.py
          git diff --exit-code -- spec/
      - name: SDK copies of the shared rules are current (Python copy, Dart and TypeScript generated code)
        run: python3 tools/sync_sdk_data.py --check
      - name: Nothing private is published
        env:
          ECHONOVA_DENYLIST: ${{ secrets.ECHONOVA_DENYLIST }}
        run: python3 tools/check_public.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: No secrets anywhere in the history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml .'

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Repository tools (recorder scrubber, CI change detection)
        run: uv run pytest ../tools/record/test_scrub.py ../tools/test_ci_changes.py

  python-lowest:
    name: Python lowest dependency versions
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - run: uv run --resolution lowest-direct --isolated pytest

  js:
    name: JavaScript (Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint:package

  js-runtimes:
    name: JavaScript runtimes (Node, Bun, Deno, workerd, Vercel Edge)
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.8"
      - run: npm ci
      - run: npm run build
      - name: Node.js
        run: npm run smoke:runtime
      - name: Bun
        run: bun scripts/smoke-runtime.mjs
      - name: Deno
        run: deno run -A scripts/smoke-runtime.mjs
      - name: workerd (Miniflare)
        run: |
          npm install --prefix "$RUNNER_TEMP/workerd" --no-audit --no-fund miniflare@4.20260730.0
          ECHONOVA_SMOKE_MINIFLARE="$RUNNER_TEMP/workerd" npm run smoke:workerd
      - name: Vercel Edge (edge-runtime emulator)
        run: |
          npm install --prefix "$RUNNER_TEMP/edge" --no-audit --no-fund edge-runtime@4.0.1
          ECHONOVA_SMOKE_EDGE_RUNTIME="$RUNNER_TEMP/edge" npm run smoke:edge

  dart:
    name: Dart (${{ matrix.sdk }})
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["3.5.0", stable]
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      # Lints change between SDK releases (older analyzers report infos that
      # newer ones don't), so infos only fail the build on the current SDK.
      - if: matrix.sdk == 'stable'
        run: dart analyze --fatal-infos
      - if: matrix.sdk != 'stable'
        run: dart analyze
      - run: dart test
      - if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed .
      - if: matrix.sdk == 'stable'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Flutter web stream transport (compiled to JavaScript, run on Node)
        if: matrix.sdk == 'stable'
        run: dart test -p node test/streaming/web_transport_test.dart

  docs:
    name: Code samples and API reference
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - name: Install
        run: |
          (cd python && uv sync --locked)
          (cd js && npm ci)
          (cd dart && dart pub get)
      - name: Code samples type-check against the SDK source
        run: python3 tools/check_snippets.py
      - name: Python API reference
        working-directory: python
        run: uv run --locked --group docs pdoc echonova echonova.resources echonova.types.streaming -o build/docs
      - name: JavaScript API reference
        working-directory: js
        run: npm run docs
      - name: Dart API reference (no warnings)
        working-directory: dart
        run: |
          set -o pipefail
          dart doc 2>&1 | tee "$RUNNER_TEMP/dartdoc.log" # the summary goes to stderr
          grep -q "Found 0 warnings and 0 errors" "$RUNNER_TEMP/dartdoc.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-reference
          path: |
            python/build/docs
            js/build/docs
            dart/doc/api
          if-no-files-found: error
          retention-days: 14

  flutter-sample:
    name: Flutter sample app
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter --disable-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --fatal-infos
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter test
      - run: flutter build web --release

  flutter-android:
    name: Flutter sample app (Android build)
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter --disable-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug

  flutter-ios:
    name: Flutter sample app (iOS build)
    needs: changes
    # macOS minutes cost ten times as much on a private repository, so until the repository
    # is public this build runs only when started by hand (Actions → CI → Run workflow).
    if: needs.changes.outputs.flutter == 'true' && (github.event_name == 'workflow_dispatch' || !github.event.repository.private)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: samples/flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter --disable-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --debug --no-codesign

  proxy-fastapi:
    name: Proxy example (FastAPI)
    needs: changes
    if: needs.changes.outputs.fastapi == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy-examples/fastapi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run --resolution lowest-direct --isolated pytest

  proxy-express:
    name: Proxy example (Express)
    needs: changes
    if: needs.changes.outputs.express == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy-examples/express
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: proxy-examples/express/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
