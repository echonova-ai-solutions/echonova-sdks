[project]
name = "echonova-proxy-fastapi"
version = "0.1.0"
description = "Reference backend proxy for the EchoNova API (FastAPI): keeps the API key on your server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.53,<1",
    "httpx>=0.27,<1",
    "websockets>=15,<16",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "PT", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # test secrets are made-up values
