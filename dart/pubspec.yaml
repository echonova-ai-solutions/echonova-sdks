name: echonova_ai
description: >-
  Official Dart and Flutter SDK for the EchoNova speech API: Text to Speech,
  Speech to Text and Sound Cleaning, over REST and WebSocket streaming.
version: 0.0.3
repository: https://github.com/echonova-ai-solutions/echonova-sdks/tree/main/dart
issue_tracker: https://github.com/echonova-ai-solutions/echonova-sdks/issues
homepage: https://echonova.ai
documentation: https://echonova.ai/docs/developers
topics:
  - speech
  - text-to-speech
  - speech-to-text
  - audio
  - arabic

environment:
  sdk: ^3.5.0

dependencies:
  crypto: ^3.0.3
  http: ^1.5.0
  http_parser: ^4.0.2
  meta: ^1.15.0

dev_dependencies:
  lints: ">=5.0.0 <7.0.0"
  stream_channel: ^2.1.0
  test: ^1.25.0
