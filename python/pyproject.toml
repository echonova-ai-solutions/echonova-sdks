[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "echonova"
dynamic = ["version"]
description = "Official Python SDK for the EchoNova speech API: Text to Speech, Speech to Text and Sound Cleaning."
readme = "README.md"
requires-python = ">=3.11"
# license: pending product decision P2 (Apache-2.0 recommended). Add before the first public release.
authors = [{ name = "EchoNova" }]
keywords = ["echonova", "speech", "tts", "stt", "arabic", "text-to-speech", "speech-to-text"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=14.1",
    "typing-extensions>=4.7",
]

[project.urls]
Documentation = "https://echonova.ai/docs/developers"
Source = "https://github.com/echonova-ai-solutions/echonova-sdks/tree/main/python"
Issues = "https://github.com/echonova-ai-solutions/echonova-sdks/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/echonova/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/echonova"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: calls the real EchoNova API (needs ECHONOVA_API_KEY; costs credits)"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "PT"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["echonova.types._base.api_field"]  # a dataclass field specifier

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # test secrets are made-up values

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
